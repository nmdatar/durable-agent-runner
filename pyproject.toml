[project]
name = "durable-agent-runner"
version = "0.1.0"
description = "A teaching project for building a durable agent runner incrementally."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
runner = "durable_agent_runner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

